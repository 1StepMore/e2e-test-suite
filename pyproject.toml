[project]
name = "omni-suite"
version = "0.2.5"
description = "Omni Localization Suite — OPP + OL + ORF meta-package"
requires-python = ">=3.13"
dependencies = [
    "prometheus_client>=0.20.0",
    "mcp>=1.0.0,<2.0.0",
    "anyio>=4.5.0,<5.0.0",
]

[project.optional-dependencies]
dev = [
    "structlog>=24.1.0",
]

[project.scripts]
omni-suite = "omni_suite.cli:main"
omni-mcp = "omni_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["omni_metrics", "omni_suite", "omni_mcp"]

[tool.uv.workspace]
members = [
    "Omni_Pre_Processor",
    "Omni_Localizer",
    "Omni_Re_Formatter",
]

[tool.uv.sources]
omni-pre-processor = { path = "Omni_Pre_Processor" }
omni-localizer = { path = "Omni_Localizer" }
omni-re-formatter = { path = "Omni_Re_Formatter" }

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [
    "Omni_Pre_Processor/src/opp/extractors",
    "Omni_Localizer/src/ol_buses",
    "Omni_Re_Formatter/src/orf/converters",
    "docker",
    "build",
    "dist",
    "*.egg-info",
    ".venv_ol",
    "node_modules",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "UP", # pyupgrade
    "N",  # pep8-naming
]
ignore = [
    "E501",  # line too long (we set line-length=100 but allow longer in some cases)
    "B008",  # function call in default argument (click/typer patterns)
    "B904",  # raise without from inside except (acceptable in MCP tool wrappers)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B", "N"]  # tests can use assert, mocks, and any naming

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
exclude = [
    "Omni_Pre_Processor/src/opp/extractors",
    "Omni_Localizer/src/ol_buses",
    "Omni_Re_Formatter/src/orf/converters",
    "docker",
    "build",
    "dist",
    ".venv_ol",
]

[[tool.mypy.overrides]]
module = "tests.*"
check_untyped_defs = false

[tool.pytest.ini_options]
markers = [
    "asyncio: async test functions",
    "e2e: end-to-end tests",
    "nightly: nightly-only tests requiring real LLM API",
    "requires_opp: tests that require the OPP component",
    "requires_ol: tests that require the OL component",
    "requires_orf: tests that require the ORF component",
    "slow: tests that take significant time",
]
