[project]
name = "omni-security"
version = "0.1.0"
description = "Canonical path-security policy shared by the Omni Suite modules."
requires-python = ">=3.13"
# Leaf library: standard library only. The module validators and the suite
# orchestrator depend on this package, never the other way round.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omni_security"]

[tool.pytest.ini_options]
# Make the tests relocatable: they import the in-tree ``src`` layout directly
# instead of requiring an editable install.
pythonpath = ["src"]
