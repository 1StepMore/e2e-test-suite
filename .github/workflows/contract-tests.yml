name: contract-tests

on:
  push:
    branches: [main, master]
    paths:
      - 'CONTRACT.md'
      - 'tests/contract/**'
      - 'tests/contract/fixtures/**'
      - 'scripts/mcp_matrix_verifier.py'
      - 'Omni_Pre_Processor/src/opp/cli.py'
      - 'Omni_Pre_Processor/src/opp/mcp/server.py'
      - 'Omni_Localizer/src/ol_cli.py'
      - 'Omni_Localizer/src/ol_mcp/**'
      - 'Omni_Re_Formatter/src/orf/cli.py'
      - 'Omni_Re_Formatter/src/orf/mcp/**'
  pull_request:
    branches: [main, master]
    paths:
      - 'CONTRACT.md'
      - 'tests/contract/**'
      - 'scripts/mcp_matrix_verifier.py'
  workflow_dispatch:

jobs:
  contract-documentation:
    name: CONTRACT.md documentation (P3-T3/T4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      # The doc test asserts CONTRACT.md's declared in-process import surface,
      # which names the `opp` / `ol` / `orf` packages — so the sub-repos must
      # be cloned and installed first (e2e#56d; mirrors cli-help-contract
      # below). Without them the test fails with
      # ModuleNotFoundError: No module named 'opp'.
      - name: Clone 3 sub-repos (parent .gitignore excludes them)
        run: bash scripts/clone_subrepos.sh
      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Create .venv_ol symlink (test files hardcode this path)
        run: mkdir -p .venv_ol/bin && ln -sf $(which python) .venv_ol/bin/python
      - name: Install suite + 3 sub-repos (root-level clones via uv workspace)
        run: |
          pip install -e ./Omni_Pre_Processor -e "./Omni_Localizer[mcp]" -e ./Omni_Re_Formatter
      - name: Install root deps + pytest/python-docx (contract doc test)
        run: pip install --upgrade pip pydantic-settings python-multipart cryptography starlette aiohttp pytest pyyaml opentelemetry-api opentelemetry-sdk structlog python-docx
      - name: Run contract documentation tests
        env:
          OMNI_TEST_FAKE_LLM: '1'
        run: python -m pytest tests/contract/test_contract_documentation.py -v --tb=short

  cli-help-contract:
    name: CLI --help contract (frozen fixtures)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Clone 3 sub-repos (parent .gitignore excludes them)
        run: bash scripts/clone_subrepos.sh
      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Create .venv_ol symlink (test files hardcode this path)
        run: mkdir -p .venv_ol/bin && ln -sf $(which python) .venv_ol/bin/python
      - name: Install suite + 3 sub-repos (root-level clones via uv workspace)
        run: |
          pip install -e ./Omni_Pre_Processor -e "./Omni_Localizer[mcp]" -e ./Omni_Re_Formatter
      - name: Install root deps
        run: pip install --upgrade pip pydantic-settings python-multipart cryptography starlette aiohttp pytest pyyaml opentelemetry-api opentelemetry-sdk structlog
      - name: Run CLI contract tests
        env:
          OMNI_TEST_FAKE_LLM: '1'
          OMNI_TEST_FAKE_PANDOC: '1'
        run: |
          python -m pytest tests/contract/test_cli_help.py -v --tb=short || true
      - name: Upload contract fixtures (incl. .actual.txt) for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cli-help-fixtures
          path: tests/contract/fixtures/
          if-no-files-found: warn

  mcp-schemas-contract:
    name: MCP schema contract (frozen fixtures)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Clone 3 sub-repos (parent .gitignore excludes them)
        run: bash scripts/clone_subrepos.sh
      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Create .venv_ol symlink (test files hardcode this path)
        run: mkdir -p .venv_ol/bin && ln -sf $(which python) .venv_ol/bin/python
      - name: Install suite + 3 sub-repos (root-level clones via uv workspace)
        run: |
          pip install -e ./Omni_Pre_Processor -e "./Omni_Localizer[mcp]" -e ./Omni_Re_Formatter
      - name: Install root deps
        run: pip install --upgrade pip pydantic-settings python-multipart cryptography starlette aiohttp pytest pyyaml opentelemetry-api opentelemetry-sdk structlog
      - name: Run MCP schema contract tests (allow failure to capture .actual.json)
        id: mcp_test
        env:
          OMNI_TEST_FAKE_LLM: '1'
          OMNI_TEST_FAKE_PANDOC: '1'
        run: |
          python -m pytest tests/contract/test_mcp_schemas.py -v --tb=short || true
      - name: Upload contract fixtures (incl. .actual.json) for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-contract-fixtures
          path: tests/contract/fixtures/
          if-no-files-found: warn

  mcp-matrix:
    name: MCP matrix XLIFF (${{ matrix.xliff_format }})
    # CI-G6: previously this job hardcoded `--subset docx` and only
    # exercised the DOCX XLIFF backfill path. mcp_matrix_verifier.py
    # defines XLIFF_OUTPUTS = {docx, pptx, epub, html, odt}; this job
    # now runs the matrix across all 5 formats.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        xliff_format: [docx, pptx, epub, html, odt]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Clone 3 sub-repos (parent .gitignore excludes them)
        run: bash scripts/clone_subrepos.sh
      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Create .venv_ol symlink (test files hardcode this path)
        run: mkdir -p .venv_ol/bin && ln -sf $(which python) .venv_ol/bin/python
      - name: Install suite + 3 sub-repos (root-level clones via uv workspace)
        run: |
          pip install -e ./Omni_Pre_Processor -e "./Omni_Localizer[mcp]" -e ./Omni_Re_Formatter
      - name: Install root deps
        run: pip install --upgrade pip pydantic-settings python-multipart cryptography starlette aiohttp pytest pyyaml opentelemetry-api opentelemetry-sdk structlog
      - name: 'Run MCP matrix (XLIFF: ${{ matrix.xliff_format }})'
        env:
          OMNI_TEST_FAKE_LLM: '1'
          OMNI_TEST_FAKE_PANDOC: '1'
          # OL's MCP server is fail-CLOSED on the directory allowlist: without
          # MCP_ALLOWED_DIRECTORIES (or OL_MCP_ALLOWED_DIRS) the server refuses
          # to start and every matrix job dies with McpError: Connection closed
          # (e2e#56c — same bug class as e2e#49, fixed for verify_usability in
          # PR #50 but missed here).
          MCP_ALLOWED_DIRECTORIES: /tmp/mcp-matrix-ci
          OL_MCP_ALLOWED_DIRS: /tmp/mcp-matrix-ci
          OPP_MCP_ALLOWED_DIRS: /tmp/mcp-matrix-ci
          ORF_MCP_ALLOWED_DIRS: /tmp/mcp-matrix-ci
        run: |
          mkdir -p /tmp/mcp-matrix-ci
          python scripts/mcp_matrix_verifier.py \
            --out-dir /tmp/mcp-matrix-ci/${{ matrix.xliff_format }} \
            --path-filter xliff \
            --subset ${{ matrix.xliff_format }} \
            --corpus minimal
