name: contract-tests

on:
  push:
    branches: [main, master]
    paths:
      - 'tests/contract/**'
      - 'tests/contract/fixtures/**'
      - 'scripts/mcp_matrix_verifier.py'
      - 'Omni_Pre_Processor/src/opp/cli.py'
      - 'Omni_Pre_Processor/src/opp/mcp/server.py'
      - 'Omni_Localizer/src/ol_cli.py'
      - 'Omni_Localizer/src/ol_mcp/**'
      - 'Omni_Re_Formatter/src/orf/cli.py'
      - 'Omni_Re_Formatter/src/orf/mcp/**'
  pull_request:
    branches: [main, master]
    paths:
      - 'tests/contract/**'
      - 'scripts/mcp_matrix_verifier.py'
  workflow_dispatch:

jobs:
  cli-help-contract:
    name: CLI --help contract (frozen fixtures)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Create .venv_ol symlink (test files hardcode this path)
        run: mkdir -p .venv_ol/bin && ln -sf $(which python) .venv_ol/bin/python
      - name: Install submodules
        run: |
          pip install -e ./src/Omni_Pre_Processor -e ./src/Omni_Localizer -e ./src/Omni_Re_Formatter
      - name: Install root deps
        run: pip install --upgrade pip pydantic-settings python-multipart cryptography starlette aiohttp pytest pyyaml opentelemetry-api opentelemetry-sdk structlog
      - name: Run CLI contract tests
        env:
          OMNI_TEST_FAKE_LLM: '1'
          OMNI_TEST_FAKE_PANDOC: '1'
        run: python -m pytest tests/contract/test_cli_help.py -v --tb=short

  mcp-schemas-contract:
    name: MCP schema contract (frozen fixtures)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Create .venv_ol symlink (test files hardcode this path)
        run: mkdir -p .venv_ol/bin && ln -sf $(which python) .venv_ol/bin/python
      - name: Install submodules with MCP extras
        run: |
          pip install -e ./src/Omni_Pre_Processor -e "./src/Omni_Localizer[mcp]" -e ./src/Omni_Re_Formatter
      - name: Install root deps
        run: pip install --upgrade pip pydantic-settings python-multipart cryptography starlette aiohttp pytest pyyaml opentelemetry-api opentelemetry-sdk structlog
      - name: Run MCP schema contract tests
        env:
          OMNI_TEST_FAKE_LLM: '1'
          OMNI_TEST_FAKE_PANDOC: '1'
        run: python -m pytest tests/contract/test_mcp_schemas.py -v --tb=short

  mcp-matrix:
    name: MCP matrix (subset, --subset docx)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Create .venv_ol symlink (test files hardcode this path)
        run: mkdir -p .venv_ol/bin && ln -sf $(which python) .venv_ol/bin/python
      - name: Install submodules with MCP extras
        run: |
          pip install -e ./src/Omni_Pre_Processor -e "./src/Omni_Localizer[mcp]" -e ./src/Omni_Re_Formatter
      - name: Install root deps
        run: pip install --upgrade pip pydantic-settings python-multipart cryptography starlette aiohttp pytest pyyaml opentelemetry-api opentelemetry-sdk structlog
      - name: Run MCP matrix (single format)
        env:
          OMNI_TEST_FAKE_LLM: '1'
          OMNI_TEST_FAKE_PANDOC: '1'
          OPP_MCP_ALLOWED_DIRS: /tmp/mcp-matrix-ci
          ORF_MCP_ALLOWED_DIRS: /tmp/mcp-matrix-ci
        run: |
          mkdir -p /tmp/mcp-matrix-ci
          python scripts/mcp_matrix_verifier.py \
            --out-dir /tmp/mcp-matrix-ci \
            --path-filter md \
            --subset docx \
            --corpus minimal
