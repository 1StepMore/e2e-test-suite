name: fidelity

on:
  push:
    branches: [main, master]
    paths:
      - 'tests/fidelity/**'
      - 'test_corpus/real/**'
      - 'test_artifacts/ol/**'
      - 'Makefile'
      - 'Omni_Localizer/src/ol_mcp/**'
      - 'Omni_Localizer/src/ol_cli.py'
  pull_request:
    branches: [main, master]
    paths:
      - 'tests/fidelity/**'
      - 'Makefile'
      - 'Omni_Localizer/src/ol_mcp/**'
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

jobs:
  fidelity-gate:
    name: Fidelity gate (char_cosine >= 0.9)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Cache .venv_ol
        uses: actions/cache@v4
        with:
          path: .venv_ol
          key: venv-ol-py313-fidelity-${{ hashFiles('Omni_Pre_Processor/pyproject.toml', 'Omni_Localizer/pyproject.toml', 'Omni_Re_Formatter/pyproject.toml') }}
      - name: Install dev deps
        run: |
          bash scripts/setup_dev.sh
      - name: Verify candidate exists
        run: |
          if [ ! -f test_artifacts/ol/alice_ch1_zhipu_real.md ]; then
            echo "ERROR: candidate test_artifacts/ol/alice_ch1_zhipu_real.md not found."
            echo "Run 'make fidelity-nightly' locally (requires ZHIPU_API_KEY) and commit the result."
            exit 1
          fi
      - name: Run fidelity gate
        env:
          OMNI_TEST_FAKE_LLM: '1'
        run: make fidelity

  fidelity-nightly:
    name: Fidelity nightly (regenerate via Zhipu)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Cache .venv_ol
        uses: actions/cache@v4
        with:
          path: .venv_ol
          key: venv-ol-py313-fidelity-${{ hashFiles('Omni_Pre_Processor/pyproject.toml', 'Omni_Localizer/pyproject.toml', 'Omni_Re_Formatter/pyproject.toml') }}
      - name: Install dev deps
        run: |
          bash scripts/setup_dev.sh
      - name: Regenerate candidate + score
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          HF_ENDPOINT: 'https://hf-mirror.com'
        run: make fidelity-nightly
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fidelity-result
          path: tests/fidelity/results/alice_ch1_fidelity.json
