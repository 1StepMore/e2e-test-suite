name: Dependency Doctor

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Cancel in-progress runs for the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  doctor:
    name: make doctor
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # ═══════════════════════════════════════════════════════════════════════
    # continue-on-error: true — non-blocking check initially.
    # Flip to continue-on-error: false after one week of green runs.
    # ═══════════════════════════════════════════════════════════════════════
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run make doctor
        env:
          OMNI_TEST_FAKE_LLM: "1"
          OMNI_TEST_FAKE_PANDOC: "1"
          OMNI_DOCTOR_SKIP_PDF: "1"
        run: make doctor
