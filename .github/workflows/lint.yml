name: lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs for the same branch (matches doctor.yml style).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history (fetch-depth 0): the diff-base steps below need the
          # PR base sha / push `before` sha / HEAD~1 objects present locally.
          # fetch-depth 1 would leave the base object absent, so
          # `git diff <base>...HEAD` would fail with "unknown revision".
          fetch-depth: 0

      # ── Changed-file scoping (review fix F1/F2) ───────────────────────────
      # The blocking lint steps below must NOT be whole-tree gates: this tree
      # carries pre-existing violations (task-8-lint-baseline.md) that the
      # plan guardrails forbid fixing, so a whole-tree gate would be red on
      # day one. Instead we resolve a diff base per event and gate only the
      # files changed by this PR/push. The ${{ }} expressions expand to empty
      # strings on events that lack the key; the [ -n ... ] guards handle it.
      #   - pull_request:   github.event.pull_request.base.sha (PR base HEAD)
      #   - push (to main): github.event.before (commit the push replaced)
      #   - otherwise:      HEAD~1 (e.g. workflow_dispatch, when it exists)
      #   - else:           empty -> changed-file list is empty -> gate no-ops
      - name: Resolve diff base (PR base sha, else push before, else HEAD~1)
        id: resolve-diff-base
        run: |
          diff_base=""
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            diff_base="${{ github.event.pull_request.base.sha }}"
          elif [ -n "${{ github.event.before }}" ]; then
            diff_base="${{ github.event.before }}"
          elif git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            diff_base="$(git rev-parse HEAD~1)"
          fi
          echo "diff_base=${diff_base}" >> "$GITHUB_OUTPUT"

      - name: List changed files (diff_base...HEAD)
        run: |
          diff_base="${{ steps.resolve-diff-base.outputs.diff_base }}"
          if [ -n "$diff_base" ]; then
            git diff --name-only "$diff_base"...HEAD | sort -u > changed_files.txt
          else
            : > changed_files.txt
          fi
          echo "changed_file_count=$(wc -l < changed_files.txt)" >> "$GITHUB_OUTPUT"
          cat changed_files.txt

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # ── Setup pattern replicated from contract-tests.yml (lines 52-63) ─────
      - name: Clone 3 sub-repos (parent .gitignore excludes them)
        run: bash scripts/clone_subrepos.sh

      - name: Create .venv_ol symlink (pre-commit smoke hook hardcodes this path)
        run: mkdir -p .venv_ol/bin && ln -sf $(which python) .venv_ol/bin/python

      - name: Install suite + 3 sub-repos (root-level clones via uv workspace)
        run: |
          pip install -e ./Omni_Pre_Processor -e "./Omni_Localizer[mcp]" -e ./Omni_Re_Formatter

      - name: Install root deps
        run: pip install --upgrade pip pydantic-settings python-multipart cryptography starlette aiohttp pytest pyyaml opentelemetry-api opentelemetry-sdk structlog

      # ── Explicit lint-tool install ──────────────────────────────────────────
      # ruff / mypy are PINNED to the exact versions the developers run locally
      # and ruff-pre-commit is pinned to the same ruff release
      # (.pre-commit-config.yaml rev v0.15.11), so a locally-green pre-commit
      # run can no longer disagree with CI. This matters because the whole-tree
      # F-class baseline is ruff-version dependent (risk #6 in
      # docs/project-health-report-2026-09-17.md: CI pinned 0.6.0 while
      # developers ran 0.15.x).
      #
      # NOTE: the pins live HERE and in .pre-commit-config.yaml — deliberately
      # not in [project.optional-dependencies].dev. Adding them there would
      # invalidate uv.lock, and relocking needs the workspace index
      # (pypi.tuna.tsinghua.edu.cn), which is not reachable from every
      # environment; a stale lock then breaks every `uv sync --locked` job.
      - name: Install lint tools (pre-commit, ruff==0.15.11, mypy==2.3.1)
        run: pip install pre-commit ruff==0.15.11 mypy==2.3.1

      # ═══════════════════════════════════════════════════════════════════════
      # EXPLICIT BLOCKING STEPS — GitHub Actions steps fail by default (nothing
      # here is exempted or allowed to be non-blocking; no shell bypass).
      # Each gate is scoped to changed_files.txt (produced by the diff-base
      # steps above): empty changed sets no-op with exit 0, non-empty sets run
      # the real blocking gate. All exit codes are truthful (no shell bypass).
      # ═══════════════════════════════════════════════════════════════════════

      - name: "Blocking: pre-commit on changed files"
        env:
          OMNI_TEST_FAKE_LLM: "1"
        run: |
          if [ -s changed_files.txt ]; then
            xargs -r pre-commit run --files < changed_files.txt
          fi
        # Runs the repo's OWN declared hook set (.pre-commit-config.yaml):
        # gitleaks, check-added-large-files, check-merge-conflict,
        # detect-private-key, end-of-file-fixer, trailing-whitespace,
        # ruff v0.15.11 (--select F --fix), omni-contract-smoke (needs
        # OMNI_TEST_FAKE_LLM=1 and the .venv_ol symlink, both set up above),
        # omni-version-alignment, omni-no-hardcoded-keys,
        # omni-version-docs-sync.
        #
        # SCOPING: runs on CHANGED files only (changed_files.txt from the
        # diff-base steps above), NOT --all-files — a whole-tree run would be
        # red on day one from pre-existing violations (ruff F-class x107, plus
        # 5 EOF/trailing-whitespace violations in out-of-scope files), all
        # recorded in .omo/evidence/doc-framework-improvements/
        # task-8-lint-baseline.md (5-file EOF list: F2-quality.md:148). Per
        # the plan guardrail, pre-existing errors are NOT fixed; this is a
        # "no NEW violations on changed files" gate. Note the ruff-pre-commit
        # hook in this set itself runs v0.15.11 --select F --fix on the changed
        # .py files only, so it too is a changed-file gate (mirroring the
        # dedicated ruff step below).

      - name: "Blocking: ruff F-class check (pinned 0.15.11, changed .py files only)"
        env:
          OMNI_TEST_FAKE_LLM: "1"
        run: |
          if [ -s changed_files.txt ]; then
            grep '\.py$' changed_files.txt | sort -u > changed_py.txt
            if [ -s changed_py.txt ]; then
              xargs -r python -m ruff check --select F < changed_py.txt
            fi
          fi
        # Pinned ruff==0.15.11 (installed above) — the same version the
        # .pre-commit-config.yaml ruff-pre-commit hook (rev v0.15.11) runs.
        # SCOPING: this step gate-keeps CHANGED .py files only
        # (filtered from changed_files.txt). The whole-tree
        # `ruff check . --select F` baseline under ruff 0.15.11 is 107 findings
        # (F841 x40, F541 x37, F401 x29, plus 1 invalid-syntax file); re-measure
        # with `ruff check . --select F --statistics` — this is a SNAPSHOT, not a
        # constant: it moved 123 -> 107 on 2026-09-17 because the changed-file
        # gate fixed real debt in the files it touched. The remainder is kept in
        # .omo/evidence/doc-framework-improvements/
        # task-8-lint-baseline.md and NOT fixed (plan guardrail). Note: the
        # grep|sort pipeline above ends with `sort` (exit 0) even when grep
        # matches nothing, so an empty changed-.py set is a no-op — the step
        # does NOT fail, so no shell bypass is needed.

      - name: "Blocking: mypy (omni_metrics + omni_suite + omni_mcp)"
        env:
          OMNI_TEST_FAKE_LLM: "1"
        run: python -m mypy omni_metrics omni_suite omni_mcp
        # SCOPE: widened 2026-09-17 from `mypy omni_metrics` (2 files, a gate
        # that proved almost nothing) to the whole suite-level Python surface —
        # 23 source files, clean under mypy 2.3.1 (docs/project-health-report-
        # 2026-09-17.md risk #10). All 14 pre-existing errors in this scope were
        # fixed (no `# type: ignore` — the repo keeps that count at 0):
        # omni_suite/cli.py (dict value type), omni_suite/contract/validator.py
        # (dicts passed where TranslationSegment was declared),
        # omni_mcp/orchestrator.py (un-narrowed `errors` list),
        # omni_mcp/validation/{dispatch,engine,cli}.py (loop-variable reuse,
        # os.environ vs dict, list invariant → Sequence/tuple-narrowing,
        # str|None passed to Path).
        # Still OUT of scope, with the observed reason recorded:
        #   - `mypy .` on the whole tree TIMES OUT (>100s) and is not clean.
        #   - `mypy scripts` -> errors in the validation/reporting scripts.
        #   - `mypy tests`   -> exit 2 (invalid package name
        #     "scene-07-multi-lang").
        # Follow-up: fix those scopes and widen this check again.

      # ═══════════════════════════════════════════════════════════════════════
      # ADR 0007 Phase 1 step 3 — path-security parity invariant.
      # The path policy exists four times (OPP core + MCP wrapper, OL, ORF, and
      # the suite-level omni_mcp orchestrator, which starts the module CLIs
      # directly and therefore never reaches a sub-module PathValidator).
      # Drift between the copies is a security defect (a fix landing in one copy
      # while the others stay stale), so the copies are pinned to one canonical
      # policy by tests/security/test_path_policy_parity.py: frozen constants,
      # a shared behavioural vector table run against all four implementations,
      # the MCP_ALLOWED_EXTENSIONS override, the legacy validate() env path, and
      # the allowlist parsers. The local half of this gate is the
      # `omni-path-policy-parity` pre-commit hook; this is the CI half.
      # SCOPE: no-ops unless the changed set touches the policy surface, since
      # the changed-file scoping rules above forbid whole-tree gates.
      - name: "Blocking: path-security parity (every copy, one policy)"
        env:
          OMNI_TEST_FAKE_LLM: "1"
        run: |
          if [ -s changed_files.txt ]; then
            if grep -Eq '^(omni_mcp/orchestrator\.py|Omni_(Pre_Processor|Localizer|Re_Formatter)/src/.*security\.py|Omni_(Pre_Processor|Localizer|Re_Formatter)/src/.*/config\.py|tests/security/test_path_policy_parity\.py)$' changed_files.txt; then
              python -m pytest tests/security/test_path_policy_parity.py -q --no-header
            else
              echo "no path-policy files changed — parity gate no-op"
            fi
          fi
        # The if/else makes an empty changed set AND an unrelated changed set
        # both exit 0 (a false `if` with no branch executed returns 0), so no
        # shell bypass is needed. When it does run it exercises ALL FOUR copies,
        # not just the one that changed — that is the whole point.
