schema: omni-suite/gates-v1
generated: 2026-11-06 (W03/C03 creation; W12/C10 hook convergence 16->14)
status_values: active | blocked | waiver (job-level; step-level blockage uses blocked_steps)
evidence_values: static (text-level inspection) | execution (runs code/binaries) | manual (human)
edit_policy: GATES.yaml may only change in topology-changing commits (creation, hook convergence, blocked-step
  registration); any other commit touching it breaks single-point rollback.
line_ending_policy:
  known_crlf_tracked_files:
  - .github/workflows/lint.yml
  - scenarios/_fixtures/generated/test_synthetic.csv
  rule: NEVER run `git add --renormalize`; no .gitattributes on purpose (new-file budget). Windows core.autocrlf=true,
    WSL has no autocrlf - commit C01-class files on the Windows side only.
