name: tool-ol-generate_report
description: "OL generate_report returns the shipped clean validation denial for any output_dir (known defect) and a clean error for wrong-shaped params."
level: agent-user
category: agent-surface
tier: 1
requires_env: [MCP_ALLOWED_DIRECTORIES]
instructions: |
  Agent-user conformance (draft D13, mission axis 1): this scenario proves the
  live tool responds as an agent-user expects — schema-shaped arguments accepted,
  structured JSON returned, and clear parseable errors on bad input, never raw
  stack-trace soup. What to check per step is written in each step's
  instructions block; the expect block is the machine-readable half and the
  standard citation names the bar from scenarios/STANDARDS.md it enforces.

steps:
  - name: 'generate_report with valid arguments returns the shipped clean denial'
    kind: python
    command: |
      import asyncio, json, sys
      sys.path.insert(0, "Omni_Localizer/src")
      from ol_mcp.tools import GenerateReportInput, generate_report
      r = asyncio.run(generate_report(params=GenerateReportInput(output_dir="/tmp/omni-agent-surface", job_id="agent-surface")))
      print(r)
    timeout_seconds: 120
    expect:
      success: true
      exit_code: 0
      stdout_has: ['OL_PATH_DENIED', 'Path is not within the allowed directories.']
      stdout_not_has: ['Traceback (most recent call last)']
    standard: STANDARDS.md#error-clarity
    instructions: "KNOWN DEFECT (finding): generate_report validates its output_dir through the file-oriented PathValidator, which rejects any directory, so the tool can never succeed as shipped. This step pins the REAL behavior: a clean OL_PATH_DENIED error carrying the sanitized PATH_DENIED_MESSAGE ('Path is not within the allowed directories.'), with no traceback. Report the defect to the ORF/OL bug track."
  - name: 'generate_report returns a clean error for wrong-shaped params'
    kind: python
    command: |
      import asyncio, json, sys
      sys.path.insert(0, "Omni_Localizer/src")
      from ol_mcp.tools import generate_report
      r = asyncio.run(generate_report(params={'job_id': 'x'}))
      print(r)
    timeout_seconds: 120
    expect:
      success: true
      exit_code: 0
      stdout_has: ['"success": false']
      stdout_not_has: ['Traceback (most recent call last)']
    standard: STANDARDS.md#error-clarity
    instructions: 'Call with a plain dict; the error boundary must return a clean JSON error, no traceback.'
