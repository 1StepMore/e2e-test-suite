name: tool-ol-extract_terms
description: "OL extract_terms extracts key terms from source texts (YAKE) and returns clean errors for bad input."
category: agent-surface
tier: 1
instructions: |
  Agent-user conformance (draft D13, mission axis 1): this scenario proves the
  live tool responds as an agent-user expects — schema-shaped arguments accepted,
  structured JSON returned, and clear parseable errors on bad input, never raw
  stack-trace soup. What to check per step is written in each step's
  instructions block; the expect block is the machine-readable half and the
  standard citation names the bar from scenarios/STANDARDS.md it enforces.

steps:
  - name: 'extract_terms extracts key terms from source texts (YAKE)'
    kind: python
    command: |
      import asyncio, json, sys
      sys.path.insert(0, "Omni_Localizer/src")
      from ol_mcp.tools import ExtractTermsInput, extract_terms
      r = asyncio.run(extract_terms(params=ExtractTermsInput(texts=["API endpoint configuration", "batch processing"])))
      print(r)
    timeout_seconds: 120
    expect:
      success: true
      exit_code: 0
      stdout_has: ['"success": true', '"terms"']
    standard: STANDARDS.md#tool-contract
    instructions: 'Construct the ExtractTermsInput params exactly as the OL MCP server does and call the REAL extract_terms function; expect a success JSON payload carrying the contract keys.'
  - name: 'extract_terms returns a clean error for wrong-shaped params'
    kind: python
    command: |
      import asyncio, json, sys
      sys.path.insert(0, "Omni_Localizer/src")
      from ol_mcp.tools import extract_terms
      r = asyncio.run(extract_terms(params={'content': 'x'}))
      print(r)
    timeout_seconds: 120
    expect:
      success: true
      exit_code: 0
      stdout_has: ['"success": false']
      stdout_not_has: ['Traceback (most recent call last)']
    standard: STANDARDS.md#error-clarity
    instructions: "Call the real function with a plain dict instead of the pydantic params model (an agent passing raw JSON); the tool's error boundary must return a clean JSON error with no traceback in the payload."
