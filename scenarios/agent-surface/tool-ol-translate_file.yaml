name: tool-ol-translate_file
description: "OL translate_file runs the OPP-OL-ORF pipeline on a document (requires real LLM keys) and returns a structured success envelope naming the backfilled output path."
level: agent-user
category: agent-surface
tier: 2
requires_env: [OL_CONFIG_PATH, OPP_CONFIG_PATH, OPP_ALLOWED_DIRECTORIES]
requires_env_any: [AMD_API_KEY, ZHIPU_API_KEY]
instructions: |
  Agent-user conformance (draft D13, mission axis 1): this scenario proves the
  live tool responds as an agent-user expects — schema-shaped arguments accepted,
  structured JSON returned, and clear parseable errors on bad input, never raw
  stack-trace soup. What to check per step is written in each step's
  instructions block; the expect block is the machine-readable half and the
  standard citation names the bar from scenarios/STANDARDS.md it enforces.
  translate_file shells out to the opp/ol/orf CLIs, so its happy contract only
  runs in a fully configured env (real LLM keys plus the CLI config vars
  declared in requires_env); key-less runs report unconfigured honestly.
steps:
  - name: "translate_file with valid args backfills the document and returns the structured success envelope"
    kind: python
    command: |
      import os, sys
      sys.path.insert(0, "Omni_Localizer/src")
      FIXT = "/tmp/omni-agent-surface"
      os.makedirs(FIXT, exist_ok=True)
      from docx import Document
      p = os.path.join(FIXT, "sample.docx")
      if not os.path.exists(p):
          d = Document()
          d.add_heading("Meridian Robotics — Product Overview", level=1)
          d.add_paragraph("Meridian Robotics is a global manufacturer of industrial automation systems.")
          d.save(p)
      import asyncio
      from ol_mcp.tools import TranslateFileInput, translate_file
      r = asyncio.run(translate_file(params=TranslateFileInput(
          file_path="/tmp/omni-agent-surface/sample.docx",
          source_lang="en", target_lang="zh",
          output_format="docx", pipeline="md")))
      print(r)
    timeout_seconds: 600
    expect:
      success: true
      exit_code: 0
      stdout_has: ['"success": true', 'output_path', 'pipeline']
      stdout_not_has: ["Traceback (most recent call last)"]
    standard: STANDARDS.md#tool-contract
    instructions: "Happy contract: translate_file drives OPP -> OL -> ORF on the fixture and returns the structured success envelope naming the backfilled output_path and the pipeline it used, with no traceback. HISTORY: this step used to pin two KNOWN DEFECTS (the md path looked for <temp>/<stem>.translated.md while `ol translate-md` writes <temp>/<stem>.md, and the xliff path passed --target-format to `orf apply-xliff` whose real option is --format). Both were fixed in Omni_Localizer by `a18b882` (OL#83) — see translate_file.py:223 `_find_output_file(...)` and the --format/--xliff args at :233-238. The assertion was flipped to the success contract so it tracks the fixed product instead of the defect; do not re-pin the old error. Keep stdout_not_has on the traceback: a failure here must still surface as a clean JSON envelope, never stack-trace soup."
    collect_artifacts:
      - path: "/tmp/omni-agent-surface/sample.docx"
  - name: "translate_file returns a clean error for wrong-shaped params"
    kind: python
    command: |
      import asyncio, sys
      sys.path.insert(0, "Omni_Localizer/src")
      from ol_mcp.tools import translate_file
      r = asyncio.run(translate_file(params={'file_path': '/tmp/x.docx'}))
      print(r)
    timeout_seconds: 120
    expect:
      success: true
      exit_code: 0
      stdout_has: ['"success": false']
      stdout_not_has: ["Traceback (most recent call last)"]
    standard: STANDARDS.md#error-clarity
    instructions: "Call with a plain dict; the error boundary must return a clean JSON error, no traceback."
