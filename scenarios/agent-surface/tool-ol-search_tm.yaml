name: tool-ol-search_tm
description: "OL search_tm returns an exact TMX fixture hit without loading embeddings (semantic path still needs the hypomnema model stack online) and denies bad paths cleanly."
level: agent-user
category: agent-surface
tier: 1
requires_env: [OMNI_TM_NETWORK, MCP_ALLOWED_DIRECTORIES]
instructions: |
  Agent-user conformance (draft D13, mission axis 1): this scenario proves the
  live tool responds as an agent-user expects — schema-shaped arguments accepted,
  structured JSON returned, and clear parseable errors on bad input, never raw
  stack-trace soup. What to check per step is written in each step's
  instructions block; the expect block is the machine-readable half and the
  standard citation names the bar from scenarios/STANDARDS.md it enforces.

steps:
  - name: 'search_tm searches the TMX fixture'
    kind: python
    command: |
      import os, sys
      sys.path.insert(0, "Omni_Localizer/src")
      FIXT = "/tmp/omni-agent-surface"
      os.makedirs(FIXT, exist_ok=True)
      if not os.path.exists(os.path.join(FIXT, "memory.tmx")):
          open(os.path.join(FIXT, "memory.tmx"), "w").write('<?xml version="1.0"?><tmx version="1.4"><body><tu><tuv xml:lang="en"><seg>Click the button</seg></tuv><tuv xml:lang="zh"><seg>点击按钮</seg></tuv></tu></body></tmx>')
      import asyncio, json, sys
      sys.path.insert(0, "Omni_Localizer/src")
      from ol_mcp.tools import SearchTMInput, search_tm
      r = asyncio.run(search_tm(params=SearchTMInput(source_text="Click the button", tmx_path="/tmp/omni-agent-surface/memory.tmx")))
      print(r)
    timeout_seconds: 300
    expect:
      success: true
      exit_code: 0
      stdout_has: ['"success": true', '"matches"', '"count"']
    standard: STANDARDS.md#tool-contract
    instructions: 'Provision the TMX fixture under /tmp (mirrors tool-ol-add_tm_entries, so this scenario runs alone on a clean machine), then call the REAL search_tm with the fixture source text. The query is an exact TM hit, so TMService.search() returns it with similarity 1.0 before the embedding model is loaded — this step is fast and hermetic (no sentence-transformers import, no HuggingFace download; requires_env OMNI_TM_NETWORK stays declared because a non-exact query would still take the semantic path and need the model). Expect success with matches and count.'
    collect_artifacts:
      - path: '/tmp/omni-agent-surface/memory.tmx'
  - name: 'search_tm returns a clean path denial for a bad TMX path'
    kind: python
    command: |
      import asyncio, json, sys
      sys.path.insert(0, "Omni_Localizer/src")
      from ol_mcp.tools import SearchTMInput, search_tm
      r = asyncio.run(search_tm(params=SearchTMInput(source_text="Click the button", tmx_path="/nonexistent/m.tmx")))
      print(r)
    timeout_seconds: 120
    expect:
      success: true
      exit_code: 0
      stdout_has: ['OL_PATH_DENIED']
      stdout_not_has: ['Traceback (most recent call last)']
    standard: STANDARDS.md#path-security
    instructions: 'Call with a nonexistent TMX path; the validator must deny it cleanly, no traceback.'
