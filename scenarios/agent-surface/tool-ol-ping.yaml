name: tool-ol-ping
description: "OL ping reports module name and version; wrong-shaped call arguments produce a clean error."
category: agent-surface
tier: 1
instructions: |
  Agent-user conformance (draft D13, mission axis 1): this scenario proves the
  live tool responds as an agent-user expects — schema-shaped arguments accepted,
  structured JSON returned, and clear parseable errors on bad input, never raw
  stack-trace soup. What to check per step is written in each step's
  instructions block; the expect block is the machine-readable half and the
  standard citation names the bar from scenarios/STANDARDS.md it enforces.

steps:
  - name: 'ping returns module and version'
    kind: mcp
    tool: ol_mcp.tools.ping
    arguments:
    timeout_seconds: 120
    expect:
      success: true
      data_has: ['"module": "ol"', 'version']
    standard: STANDARDS.md#tool-contract
    instructions: 'Call the real ping tool function directly (it takes no pydantic model); expect success with module and version in the JSON payload.'
  - name: 'ping rejects an unexpected argument cleanly'
    kind: mcp
    tool: ol_mcp.tools.ping
    arguments:
      bogus: 1
    timeout_seconds: 120
    expect:
      success: false
    standard: STANDARDS.md#error-clarity
    instructions: "Call ping with an undeclared argument; the call must fail with a clean agent-readable error naming the argument (the error text lands in the run record's actual.error)."
