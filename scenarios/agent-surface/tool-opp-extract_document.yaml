name: tool-opp-extract_document
description: "OPP extract_document extracts a DOCX fixture to markdown via the real tool function and denies out-of-allowlist paths cleanly."
category: agent-surface
tier: 1
requires_env: [OPP_MCP_ALLOWED_DIRS]
instructions: |
  Agent-user conformance (draft D13, mission axis 1): this scenario proves the
  live tool responds as an agent-user expects — schema-shaped arguments accepted,
  structured JSON returned, and clear parseable errors on bad input, never raw
  stack-trace soup. What to check per step is written in each step's
  instructions block; the expect block is the machine-readable half and the
  standard citation names the bar from scenarios/STANDARDS.md it enforces.

steps:
  - name: 'Provision fixtures and extract the DOCX via the real tool (in-process server init)'
    kind: python
    command: |
      import asyncio, json, os, sys
      sys.path.insert(0, "Omni_Pre_Processor/src")
      FIXT = "/tmp/omni-agent-surface"
      os.makedirs(FIXT, exist_ok=True)
      from docx import Document
      p = os.path.join(FIXT, "sample.docx")
      if not os.path.exists(p):
          d = Document()
          d.add_heading("Meridian Robotics — Product Overview", level=1)
          d.add_paragraph("Meridian Robotics is a global manufacturer of industrial automation systems.")
          d.save(p)
      from opp.mcp.config import load_config
      from opp.mcp.common import _init_server
      _init_server(load_config())
      from opp.mcp.server import extract_document
      r = asyncio.run(extract_document(file_path=p, output_formats="md"))
      print(json.dumps(r, ensure_ascii=False))
    timeout_seconds: 120
    expect:
      success: true
      exit_code: 0
      stdout_has: ['"success": true', 'md_content', 'Meridian Robotics']
    standard: STANDARDS.md#tool-contract
    instructions: "This step drives the REAL extract_document function after initializing OPP's server state exactly like `opp mcp` does (the engine dispatch cannot perform _init_server). The extraction must succeed and print a JSON payload carrying md_content with the document text."
    collect_artifacts:
      - path: '/tmp/omni-agent-surface/sample.docx'
  - name: 'extract_document denies a path outside the allowlist'
    kind: python
    command: |
      import asyncio, json, sys
      sys.path.insert(0, "Omni_Pre_Processor/src")
      from opp.mcp.config import load_config
      from opp.mcp.common import _init_server
      _init_server(load_config())
      from opp.mcp.server import extract_document
      r = asyncio.run(extract_document(file_path="/etc/hosts", output_formats="md"))
      print(json.dumps(r, ensure_ascii=False))
    timeout_seconds: 120
    expect:
      success: true
      exit_code: 0
      stdout_has: ['"success": false']
      stdout_not_has: ['Traceback (most recent call last)']
    standard: STANDARDS.md#path-security
    instructions: 'Call the same real tool with a system-directory path outside the configured allowlist. The call MUST be denied: success false in the payload, no traceback in the payload. Known shipped quirk (finding): the denial currently surfaces as the generic OPP_INTERNAL_ERROR code because opp.mcp._errors maps a different PathValidationError class than opp.utils.security raises; the denial itself is real.'
