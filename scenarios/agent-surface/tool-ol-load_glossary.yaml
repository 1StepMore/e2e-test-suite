name: tool-ol-load_glossary
description: "OL load_glossary loads a JSON glossary fixture and returns a clean path error for a bad path."
category: agent-surface
tier: 1
requires_env: [OL_MCP_ALLOWED_DIRS]
instructions: |
  Agent-user conformance (draft D13, mission axis 1): this scenario proves the
  live tool responds as an agent-user expects — schema-shaped arguments accepted,
  structured JSON returned, and clear parseable errors on bad input, never raw
  stack-trace soup. What to check per step is written in each step's
  instructions block; the expect block is the machine-readable half and the
  standard citation names the bar from scenarios/STANDARDS.md it enforces.

steps:
  - name: 'load_glossary loads the glossary fixture'
    kind: python
    command: |
      import os, sys
      sys.path.insert(0, "Omni_Localizer/src")
      FIXT = "/tmp/omni-agent-surface"
      os.makedirs(FIXT, exist_ok=True)
      import json as _json
      if not os.path.exists(os.path.join(FIXT, "glossary.json")):
          _json.dump({"API endpoint": {"translation": "API 端点", "confidence": 0.95}}, open(os.path.join(FIXT, "glossary.json"), "w"))
      import asyncio, json, sys
      sys.path.insert(0, "Omni_Localizer/src")
      from ol_mcp.tools import LoadGlossaryInput, load_glossary
      r = asyncio.run(load_glossary(params=LoadGlossaryInput(path="/tmp/omni-agent-surface/glossary.json")))
      print(r)
    timeout_seconds: 120
    expect:
      success: true
      exit_code: 0
      stdout_has: ['"success": true', '"glossary"', 'term_count']
    standard: STANDARDS.md#tool-contract
    instructions: 'Provision the glossary fixture under /tmp, construct LoadGlossaryInput and call the REAL load_glossary; expect success with glossary and term_count keys.'
    collect_artifacts:
      - path: '/tmp/omni-agent-surface/glossary.json'
  - name: 'load_glossary returns a clean path denial for a bad path'
    kind: python
    command: |
      import asyncio, json, sys
      sys.path.insert(0, "Omni_Localizer/src")
      from ol_mcp.tools import LoadGlossaryInput, load_glossary
      r = asyncio.run(load_glossary(params=LoadGlossaryInput(path="/nonexistent/glossary.json")))
      print(r)
    timeout_seconds: 120
    expect:
      success: true
      exit_code: 0
      stdout_has: ['OL_PATH_DENIED']
      stdout_not_has: ['Traceback (most recent call last)']
    standard: STANDARDS.md#path-security
    instructions: 'Call with a nonexistent path outside the allowlist; the OL PathValidator must deny it with a clean OL_PATH_DENIED error, no traceback.'
