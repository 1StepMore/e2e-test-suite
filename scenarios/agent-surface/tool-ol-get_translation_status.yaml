name: tool-ol-get_translation_status
description: "OL get_translation_status answers unknown request ids with a clean NOT_FOUND and wrong-shaped params with a clean error."
category: agent-surface
tier: 1
instructions: |
  Agent-user conformance (draft D13, mission axis 1): this scenario proves the
  live tool responds as an agent-user expects — schema-shaped arguments accepted,
  structured JSON returned, and clear parseable errors on bad input, never raw
  stack-trace soup. What to check per step is written in each step's
  instructions block; the expect block is the machine-readable half and the
  standard citation names the bar from scenarios/STANDARDS.md it enforces.

steps:
  - name: 'get_translation_status answers an unknown request id with NOT_FOUND'
    kind: python
    command: |
      import asyncio, json, sys
      sys.path.insert(0, "Omni_Localizer/src")
      from ol_mcp.tools import GetTranslationStatusInput, get_translation_status
      r = asyncio.run(get_translation_status(params=GetTranslationStatusInput(request_id="00000000-0000-0000-0000-000000000000")))
      print(r)
    timeout_seconds: 120
    expect:
      success: true
      exit_code: 0
      stdout_has: ['NOT_FOUND', 'No task found with request_id']
      stdout_not_has: ['Traceback (most recent call last)']
    standard: STANDARDS.md#error-clarity
    instructions: 'This hermetic process has no live async translation tasks, so any request id answers NOT_FOUND. That clean, parseable denial IS the contract being verified (an agent must never see a traceback for a stale id). With real LLM keys, async translate_md_text creates tasks this tool then reports.'
  - name: 'get_translation_status returns a clean error for wrong-shaped params'
    kind: python
    command: |
      import asyncio, json, sys
      sys.path.insert(0, "Omni_Localizer/src")
      from ol_mcp.tools import get_translation_status
      r = asyncio.run(get_translation_status(params={'bogus': 1}))
      print(r)
    timeout_seconds: 120
    expect:
      success: true
      exit_code: 0
      stdout_has: ['"success": false']
      stdout_not_has: ['Traceback (most recent call last)']
    standard: STANDARDS.md#error-clarity
    instructions: 'Call with a plain dict; the error boundary must return a clean JSON error, no traceback.'
