name: tool-orf-apply_md
description: "ORF apply_md converts a markdown fixture to HTML and rejects calls with neither input cleanly."
level: agent-user
category: agent-surface
tier: 1
requires_env: [ORF_MCP_ALLOWED_DIRS]
instructions: |
  Agent-user conformance (draft D13, mission axis 1): this scenario proves the
  live tool responds as an agent-user expects — schema-shaped arguments accepted,
  structured JSON returned, and clear parseable errors on bad input, never raw
  stack-trace soup. What to check per step is written in each step's
  instructions block; the expect block is the machine-readable half and the
  standard citation names the bar from scenarios/STANDARDS.md it enforces.

steps:
  - name: 'Provision fixtures'
    kind: python
    command: |
      import os, shutil, sys
      sys.path.insert(0, "Omni_Localizer/src")
      FIXT = "/tmp/omni-agent-surface"
      os.makedirs(FIXT, exist_ok=True)
      import json as _json
      from docx import Document
      if not os.path.exists(os.path.join(FIXT, "sample.docx")):
          d = Document()
          d.add_heading("Meridian Robotics — Product Overview", level=1)
          d.add_paragraph("Meridian Robotics is a global manufacturer of industrial automation systems.")
          d.save(os.path.join(FIXT, "sample.docx"))
      if not os.path.exists(os.path.join(FIXT, "sample.md")):
          open(os.path.join(FIXT, "sample.md"), "w").write("# Hello World\n\nThis is a test document.\n")
      if not os.path.exists(os.path.join(FIXT, "sample_fm.md")):
          open(os.path.join(FIXT, "sample_fm.md"), "w").write("---\nsource_lang: en\ntarget_lang: zh\n---\n# Frontmatter Doc\n\nBody text here.\n")
      if not os.path.exists(os.path.join(FIXT, "glossary.json")):
          _json.dump({"API endpoint": {"translation": "API 端点", "confidence": 0.95}}, open(os.path.join(FIXT, "glossary.json"), "w"))
      if not os.path.exists(os.path.join(FIXT, "memory.tmx")):
          open(os.path.join(FIXT, "memory.tmx"), "w").write('<?xml version="1.0"?><tmx version="1.4"><body><tu><tuv xml:lang="en"><seg>Click the button</seg></tuv><tuv xml:lang="zh"><seg>点击按钮</seg></tuv></tu></body></tmx>')
      if not os.path.exists(os.path.join(FIXT, "sample.xlf")):
          open(os.path.join(FIXT, "sample.xlf"), "w").write('<?xml version="1.0" encoding="utf-8"?><xliff version="1.2" xmlns="urn:oasis:names:tc:xliff:document:1.2"><file original="sample.md" source-language="en" target-language="zh"><body><trans-unit id="1"><source>Hello World</source><target>你好世界</target></trans-unit></body></file></xliff>')
      if not os.path.exists(os.path.join(FIXT, "warn.md")):
          open(os.path.join(FIXT, "warn.md"), "w").write("# Hi\n<!-- OL_WARN:missing_shields key1 -->\nbody\n")
      if not os.path.exists(os.path.join(FIXT, "default.yaml")):
          shutil.copy("Omni_Localizer/config/default.yaml", os.path.join(FIXT, "default.yaml"))
      print("fixtures provisioned")
    timeout_seconds: 120
    expect:
      success: true
      exit_code: 0
    standard: STANDARDS.md#tool-contract
    instructions: 'Write the hermetic fixture set (sample.md, sample.docx, sample.xlf, glossary.json, memory.tmx) under /tmp/omni-agent-surface so the tool steps have real files inside the allowlist.'
  - name: 'apply_md converts the MD fixture to HTML'
    kind: mcp
    tool: orf.mcp.server.apply_md
    arguments:
      input_md: /tmp/omni-agent-surface/sample.md
      target_format: html
      output_path: /tmp/omni-agent-surface/applied.html
    timeout_seconds: 120
    expect:
      success: true
      data_has: ['"success": true', 'output_path']
    standard: STANDARDS.md#tool-contract
    instructions: 'Call apply_md with the MD fixture, target format html and an output path inside the allowlist; expect success with output_path.'
    collect_artifacts:
      - path: '/tmp/omni-agent-surface/applied.html'
  - name: 'apply_md rejects a call with no input'
    kind: mcp
    tool: orf.mcp.server.apply_md
    arguments:
      target_format: html
    timeout_seconds: 120
    expect:
      success: false
      data_has: ['MISSING_INPUT', 'Either input_md (path) or content']
    standard: STANDARDS.md#error-clarity
    instructions: 'Call with neither input_md nor content; the tool must return a clean MISSING_INPUT error naming the contract, no traceback.'
