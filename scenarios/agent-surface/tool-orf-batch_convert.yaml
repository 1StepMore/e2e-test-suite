name: tool-orf-batch_convert
description: "ORF batch_convert converts the frontmatter-marked fixture dir to HTML with a structured success payload, and denies out-of-allowlist dirs."
level: agent-user
category: agent-surface
tier: 1
requires_env: [ORF_MCP_ALLOWED_DIRS]
instructions: |
  Agent-user conformance (draft D13, mission axis 1): this scenario proves the
  live tool responds as an agent-user expects — schema-shaped arguments accepted,
  structured JSON returned, and clear parseable errors on bad input, never raw
  stack-trace soup. What to check per step is written in each step's
  instructions block; the expect block is the machine-readable half and the
  standard citation names the bar from scenarios/STANDARDS.md it enforces.

steps:
  - name: 'Provision fixtures'
    kind: python
    command: |
      import os, sys
      FIXT = "/tmp/omni-batch-convert-fixture"
      os.makedirs(FIXT, exist_ok=True)
      target = os.path.join(FIXT, "sample_fm.md")
      if not os.path.exists(target):
          open(target, "w").write("---\nsource_lang: en\ntarget_lang: zh\n---\n# Frontmatter Doc\n\nBody text here.\n")
      print("fixtures provisioned")
    timeout_seconds: 120
    expect:
      success: true
      exit_code: 0
    standard: STANDARDS.md#tool-contract
    instructions: "Write ONE frontmatter-marked .md under a directory dedicated to this scenario. It must not be /tmp/omni-agent-surface: 22 agent-surface scenarios share that directory, `orf convert-batch` scans recursively (rglob *.md) and counts every file carrying frontmatter, so any sibling scenario that translates into the shared dir silently changes this scenario's `succeeded` count. That happened — the 2026-10-06..11 nightlies all reported succeeded 2 instead of 1 because a tier-2 OL scenario ran first in the all-tier pass and dropped a translated .md beside the fixture."
  - name: 'batch_convert converts the fixture dir and reports structured success'
    kind: mcp
    tool: orf.mcp.server.batch_convert
    arguments:
      input_dir: /tmp/omni-batch-convert-fixture
      target_format: html
    timeout_seconds: 120
    expect:
      success: true
      data_has: ['"success": true', '"status": "complete"', '"succeeded": 1']
      json_has:
        - {path: data.success, value: true}
        - {path: data.content.status, value: complete}
        - {path: data.content.succeeded, value: 1}
    standard: STANDARDS.md#tool-contract
    instructions: 'Call batch_convert on the dedicated fixture dir; the ORF CLI emits a pure-JSON payload (its progress line goes to stderr) so the MCP layer parses it and the response reports structured success — data.success true, data.status "complete", data.succeeded 1, with no spurious error envelope. The count is asserted exactly because the dir is isolated: a shared dir would make this number depend on whatever other scenarios ran first. The tool must return an agent-readable success payload, never a raw stack trace.'
  - name: 'batch_convert denies an out-of-allowlist directory'
    kind: mcp
    tool: orf.mcp.server.batch_convert
    arguments:
      input_dir: /etc
      target_format: html
    timeout_seconds: 120
    expect:
      success: false
      data_has: ['PATH_NOT_ALLOWED', 'Access to system directory not allowed']
    standard: STANDARDS.md#path-security
    instructions: 'Call with a system-directory input; the ORF PathValidator must deny it with a clean PATH_NOT_ALLOWED error naming the directory, no traceback.'
