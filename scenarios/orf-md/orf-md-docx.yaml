name: orf-md-docx
description: >-
  ORF apply-md backfill to DOCX: run the real `orf apply-md` CLI on a
  synthetic translated MD and verify the output carries the DOCX
  structural signature (OOXML zip archive with word/document.xml; python-docx opens it with >= 1 paragraph).
level: human-quality
category: orf-md
tier: 1
requires_env: []
instructions: |-
  Prove ORF apply-md backfills a translated MD to DOCX with the real surface ('orf apply-md ... --target-format docx'). 1) the write step creates the synthetic translated MD at /tmp/omni_val/orf-md-docx/in.md; 2) the CLI step runs the real backfill to /tmp/omni_val/orf-md-docx/out.docx and must exit 0; 3) the assert step reads the output and checks the DOCX signature: OOXML zip archive with word/document.xml; python-docx opens it with >= 1 paragraph. No LLM, no FAKE_LLM, no fixtures — hermetic and deterministic (tier 1).
steps:
  - name: Write synthetic translated MD
    kind: python
    command: |-
      import pathlib
      d = pathlib.Path("/tmp/omni_val/orf-md-docx")
      d.mkdir(parents=True, exist_ok=True)
      md = """---
      source_lang: en
      target_lang: zh
      original_file: synthetic_test.md
      processor: "FAKE_LLM"
      version: "0.0.1"
      translated_at: 2026-06-19T00:00:00Z
      ---

      # Synthetic Document

      ## Introduction

      This is a **synthetic markdown** file used for ORF conversion testing. It contains various
      elements to exercise format converters.

      ## Features

      - Feature 1: Multi-format support
      - Feature 2: High performance
      - Feature 3: Easy integration

      ## Data Table

      | Name | Value | Status |
      |------|-------|--------|
      | Alpha | 100 | Active |
      | Beta | 200 | Pending |
      | Gamma | 300 | Active |

      ## JSON Data

      ```json
      {"products": [{"name": "Alpha", "value": 100}, {"name": "Beta", "value": 200}]}
      ```

      ## Code Example

      ```
      print("Hello, World!")
      for i in range(3):
          print(f"Item {i}")
      ```

      ## Contact

      For more information, please contact support@example.com.
      """
      (d / "in.md").write_text(md, encoding="utf-8")
      print("WROTE /tmp/omni_val/orf-md-docx/in.md")
    expect:
      exit_code: 0
      stdout_has: ["WROTE /tmp/omni_val/orf-md-docx/in.md"]
    standard: STANDARDS.md#exit-codes
    instructions: |-
      Generate the translated-MD input for this scenario at run time (no committed fixture). The file must carry a YAML frontmatter with the 6 metadata keys (source_lang, target_lang, original_file, processor, version, translated_at) and a body with a heading, a list, a table, a JSON code fence and a code fence — the same shape the suite's _create_synthetic_md fixture uses (tests/test_cross_format_e2e.py:282-334). Check: the snippet exits 0 and prints the WROTE marker naming /tmp/omni_val/orf-md-docx/in.md.
  - name: Backfill to DOCX with orf apply-md
    kind: cli
    command: orf apply-md /tmp/omni_val/orf-md-docx/in.md --target-format docx -o /tmp/omni_val/orf-md-docx/out.docx
    timeout_seconds: 180
    expect:
      exit_code: 0
      stdout_has: ["Created /tmp/omni_val/orf-md-docx/out.docx"]
    standard: STANDARDS.md#exit-codes
    collect_artifacts:
      - path: /tmp/omni_val/orf-md-docx/out.docx
    instructions: |-
      Run the REAL orf CLI backfill: `orf apply-md /tmp/omni_val/orf-md-docx/in.md --target-format docx -o /tmp/omni_val/orf-md-docx/out.docx`. Engine: pandoc (via pypandoc-binary). Check: exit code 0 (STANDARDS.md#exit-codes) and stdout announces the created file (both fresh conversions and cached ones print `Created <path>`). The assertion on the output file is the next step.
  - name: Assert DOCX structural invariant
    kind: python
    command: |-
      import sys, zipfile
      p = "/tmp/omni_val/orf-md-docx/out.docx"
      try:
          assert zipfile.is_zipfile(p), "not a zip archive"
          names = zipfile.ZipFile(p).namelist()
          assert "word/document.xml" in names, "missing word/document.xml"
          from docx import Document
          doc = Document(p)
          assert len(doc.paragraphs) > 0, "python-docx opens with zero paragraphs"
          print("OK: docx is a valid OOXML zip with word/document.xml; python-docx opens with %d paragraphs" % len(doc.paragraphs))
      except Exception as e:
          print("ERROR: %s" % e)
          sys.exit(1)
    expect:
      exit_code: 0
      stdout_has: ["OK:"]
    standard: STANDARDS.md#opens-docx
    collect_artifacts:
      - path: /tmp/omni_val/orf-md-docx/out.docx
    instructions: |-
      Read /tmp/omni_val/orf-md-docx/out.docx and verify the DOCX structural invariant: OOXML zip archive with word/document.xml; python-docx opens it with >= 1 paragraph. The snippet exits 0 with an OK: message when the invariant holds, or exits 1 naming the problem otherwise (per-step instructions; exit-code contract).
