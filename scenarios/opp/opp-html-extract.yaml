name: opp-html-extract
description: >
  OPP extracts an HTML page to Markdown: runtime-generated synthetic HTML
  (headings, paragraphs, lists) -> exit 0, manifest metadata keys,
  declared format HTML, and heading/list structure preserved as markdown.
category: opp-extraction
instructions: |
  What to do:
  1. Generate a synthetic HTML page at runtime (plain string write) — no
     fixture file is committed for this format.
  2. Run the real OPP CLI on it with --target-format md into a fresh dir.
  3. Parse the *_manifest.json — valid JSON, format HTML.
  4. Read the .md — the H1/H2 headings and list items must survive.
  Generator logic ported from tests/test_cross_format_e2e.py:142-166
  (_create_synthetic_html).  Deterministic: no LLM, no FAKE_LLM.
steps:
  - name: Generate the synthetic HTML page at runtime
    kind: python
    command: |
      import pathlib
      html = ('<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">'
              '<title>Synthetic Test Page</title></head><body><article>'
              '<h1>Product Overview</h1>'
              '<p>This synthetic HTML page contains <strong>structured content</strong>.</p>'
              '<h2>Features</h2><ul>'
              '<li>Multi-format document processing</li>'
              '<li>Neural machine translation</li>'
              '</ul></article></body></html>')
      out = pathlib.Path("/tmp/omni_val/opp-html/in.html")
      out.parent.mkdir(parents=True, exist_ok=True)
      out.write_text(html, encoding="utf-8")
      print("written")
    expect:
      exit_code: 0
      stdout_has: ["written"]
    standard: STANDARDS.md#tool-contract
    instructions: |
      What to check: the generator writes the HTML and prints "written";
      a failure means the fixture could not be produced.
  - name: Extract HTML to Markdown via the real OPP CLI
    kind: cli
    command: opp /tmp/omni_val/opp-html/in.html --target-format md --output-dir /tmp/omni_val/opp-html -v
    expect:
      exit_code: 0
      stderr_has: ["[INFO] Generated:"]
    timeout_seconds: 180
    standard: STANDARDS.md#exit-codes
    instructions: |
      What to check: the CLI exits 0 (exit-codes standard) and verbose
      stderr prints "[INFO] Generated:" — the real success marker.
  - name: Manifest parses as JSON and declares the HTML format
    kind: python
    command: |
      import json, pathlib
      m = json.loads(pathlib.Path("/tmp/omni_val/opp-html/in_manifest.json").read_text(encoding="utf-8"))
      print(",".join(sorted(m.keys())))
      print("format=" + m["source"]["format"])
      print("md-path=" + m["extraction"]["outputs"]["markdown"]["path"])
    expect:
      exit_code: 0
      stdout_has:
        - "manifest_version"
        - "source"
        - "extraction"
        - "format=HTML"
        - "md-path=in.md"
    standard: STANDARDS.md#json-parseable
    instructions: |
      What to check: json.loads succeeds (json-parseable), metadata keys
      manifest_version/source/extraction present (>= 4 keys), declared
      format HTML and markdown path in.md.
  - name: Markdown preserves the heading and list structure
    kind: python
    command: |
      import pathlib
      md = pathlib.Path("/tmp/omni_val/opp-html/in.md").read_text(encoding="utf-8")
      print("h1-found" if "# Product Overview" in md else "no-h1")
      print("h2-found" if "## Features" in md else "no-h2")
      print("list-found" if "Multi-format document processing" in md else "no-list")
    expect:
      exit_code: 0
      stdout_has:
        - "h1-found"
        - "h2-found"
        - "list-found"
    standard: STANDARDS.md#tool-contract
    instructions: |
      What to check: the extraction output carries the expected HTML
      structure (tool-contract standard): the H1/H2 headings survive as
      markdown headings and the list item text is present.
