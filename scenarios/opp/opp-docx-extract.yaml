name: opp-docx-extract
description: >
  OPP extracts a real DOCX to Markdown + XLIFF (--target-format both):
  exit 0, manifest metadata block with >= 4 keys (the extraction-side
  equivalent of the OL-side YAML frontmatter), markdown heading/table
  structure preserved, and an XLIFF carrying trans-units for the zh
  target language.
level: agent-user
category: opp-extraction
instructions: |
  What to do:
  1. Run the real OPP CLI on the committed Meridian DOCX fixture with
     --target-format both (MD + XLIFF in one pass) into a fresh dir.
  2. Parse the produced *_manifest.json — it must be valid JSON with the
     standard metadata keys (manifest_version/source/extraction/...).
  3. Read the produced .md — the document heading + table structure must
     survive extraction.  Read the .xlf — it must carry trans-units and
     declare target-language="zh" (OPP preps targets; OL fills them later).
  The fixture is the committed suite-root
  Meridian_Robotics_Product_Overview_E2E.docx (also copied to
  scenarios/_fixtures/ by todo 16 — this scenario uses the original path).
  Extraction is deterministic: no LLM, no FAKE_LLM, no network.
steps:
  - name: Extract DOCX to Markdown and XLIFF via the real OPP CLI
    kind: cli
    command: opp Meridian_Robotics_Product_Overview_E2E.docx --target-format both --source-lang en --target-lang zh --output-dir /tmp/omni_val/opp-docx -v
    expect:
      exit_code: 0
      stderr_has: ["[INFO] Generated:"]
    timeout_seconds: 180
    standard: STANDARDS.md#exit-codes
    instructions: |
      What to check: the CLI exits 0 (exit-codes standard) and the
      verbose stderr prints "[INFO] Generated:" — the real success marker
      OPP emits (stdout is empty by design).
  - name: Manifest parses as JSON and exposes the metadata keys
    kind: python
    command: |
      import json, pathlib
      m = json.loads(pathlib.Path("/tmp/omni_val/opp-docx/Meridian_Robotics_Product_Overview_E2E_manifest.json").read_text(encoding="utf-8"))
      print(",".join(sorted(m.keys())))
      print("format=" + m["source"]["format"])
      print("md-path=" + m["extraction"]["outputs"]["markdown"]["path"])
    expect:
      exit_code: 0
      stdout_has:
        - "manifest_version"
        - "source"
        - "extraction"
        - "format=DOCX"
        - "md-path=Meridian_Robotics_Product_Overview_E2E.md"
    standard: STANDARDS.md#json-parseable
    instructions: |
      What to check: json.loads succeeds (json-parseable standard), the
      top-level key set includes manifest_version/source/extraction (>= 4
      metadata keys — the OPP-side analogue of OL frontmatter), and the
      declared format/paths are the expected DOCX ones.
  - name: Markdown keeps the document structure and XLIFF carries trans-units
    kind: python
    command: |
      import pathlib, re
      md = pathlib.Path("/tmp/omni_val/opp-docx/Meridian_Robotics_Product_Overview_E2E.md").read_text(encoding="utf-8")
      xlf = pathlib.Path("/tmp/omni_val/opp-docx/Meridian_Robotics_Product_Overview_E2E.xlf").read_text(encoding="utf-8")
      print("heading-found" if "# Meridian Robotics" in md else "no-heading")
      print("table-found" if "| Model |" in md else "no-table")
      print("units-found" if len(re.findall(r"<trans-unit", xlf)) > 0 else "no-units")
      print("target-zh" if 'target-language="zh"' in xlf else "no-target-zh")
    expect:
      exit_code: 0
      stdout_has:
        - "heading-found"
        - "table-found"
        - "units-found"
        - "target-zh"
    standard: STANDARDS.md#tool-contract
    instructions: |
      What to check: the extraction output carries the expected document
      structure (tool-contract standard): the H1 "Meridian Robotics", the
      MR-Series spec table, and an XLIFF with at least one trans-unit and
      the zh target-language attribute declared (OPP prep).
