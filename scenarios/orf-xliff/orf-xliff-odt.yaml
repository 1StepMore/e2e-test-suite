name: orf-xliff-odt
description: >-
  ORF apply-xliff backfill to ODT: run the real `orf apply-xliff` CLI on the
  committed translated-XLIFF fixture pair (source.odt + source.xlf, hermetic)
  and verify the backfilled ODT carries the ODF structural signature (zip with
  mimetype as FIRST entry = application/vnd.oasis.opendocument.text, content.xml
  present). The ODT channel needs NO skeleton.zip — it uses the xliff2odf
  channel (translate-toolkit) directly on the committed source.odt. NOTE
  (finding): the committed source.odt contains TRUNCATED paragraph text that
  does not exactly match the xlf sources, so translate-toolkit's exact match
  finds no unit and the Chinese targets are not injected. This scenario
  honestly asserts the channel contract that IS live: exit 0 + Created + valid
  ODF structure (finding recorded in learnings.md).
category: orf-xliff
tier: 1
requires_env: []
instructions: |-
  Prove ORF apply-xliff runs the ODT backfill channel on the committed pair. 1) the copy step stages the 8 committed fixture files into /tmp/omni_val/orf-xliff-odt/; 2) the CLI step runs `orf apply-xliff <committed source.odt> --xliff <translated xlf> --format odt` — NO skeleton (the xliff2odf channel takes the ODF skeleton directly) — and must exit 0 with a Created announcement; 3) the assert step verifies the output is a valid ODF zip: mimetype FIRST entry with application/vnd.oasis.opendocument.text and content.xml present. Empirically the committed source.odt's paragraphs are truncated versions of the xlf sources, so translate-toolkit's exact match finds no unit and no Chinese is injected — translated-target presence is therefore NOT asserted here; the assertable contract is exit 0 + valid ODF structure (finding in learnings.md). No LLM, no FAKE_LLM — hermetic (tier 1).
steps:
  - name: Stage committed translated fixture pair
    kind: python
    command: |-
      import pathlib, shutil
      src = pathlib.Path("scenarios/_fixtures/translated_pair")
      d = pathlib.Path("/tmp/omni_val/orf-xliff-odt")
      d.mkdir(parents=True, exist_ok=True)
      files = [f for f in src.iterdir() if f.is_file()]
      for f in files:
          shutil.copy2(f, d / f.name)
      print("COPIED %d fixture files" % len(files))
    expect:
      exit_code: 0
      stdout_has: ["COPIED 7 fixture files"]
    standard: STANDARDS.md#exit-codes
    instructions: |-
      Copy the committed fixture pair (7 files incl. source.odt + the pre-translated source.xlf) from scenarios/_fixtures/translated_pair/ into /tmp/omni_val/orf-xliff-odt/. Check: exit 0 and "COPIED 7 fixture files".
  - name: Backfill translated XLIFF to ODT with orf apply-xliff
    kind: cli
    command: orf apply-xliff /tmp/omni_val/orf-xliff-odt/source.odt --xliff /tmp/omni_val/orf-xliff-odt/source.xlf --output /tmp/omni_val/orf-xliff-odt/out.odt --format odt
    timeout_seconds: 300
    expect:
      exit_code: 0
      stdout_has: ["Created /tmp/omni_val/orf-xliff-odt/out.odt"]
    standard: STANDARDS.md#exit-codes
    collect_artifacts:
      - path: /tmp/omni_val/orf-xliff-odt/out.odt
    instructions: |-
      Run the REAL orf CLI backfill: `orf apply-xliff <committed source.odt> --xliff <committed translated source.xlf> --output out.odt --format odt`. The ODT channel (xliff2odf, translate-toolkit) takes the ODF skeleton directly — NO skeleton.zip is involved for ODT. Check: exit code 0 (STANDARDS.md#exit-codes) and stdout announces "Created <path>". The assertion on the output structure is the next step.
  - name: Assert ODT ODF structural invariant
    kind: python
    command: |-
      import sys, zipfile
      p = "/tmp/omni_val/orf-xliff-odt/out.odt"
      try:
          assert zipfile.is_zipfile(p), "not a zip archive"
          z = zipfile.ZipFile(p)
          names = z.namelist()
          assert names and names[0] == "mimetype", "mimetype must be the first zip entry"
          assert z.read("mimetype").decode() == "application/vnd.oasis.opendocument.text", "bad odt mimetype"
          assert "content.xml" in names, "missing content.xml"
          print("OK: odf zip with mimetype + content.xml, %d entries" % len(names))
      except Exception as e:
          print("ERROR: %s" % e)
          sys.exit(1)
    expect:
      exit_code: 0
      stdout_has: ["OK:"]
    standard: STANDARDS.md#exit-codes
    collect_artifacts:
      - path: /tmp/omni_val/orf-xliff-odt/out.odt
    instructions: |-
      Read /tmp/omni_val/orf-xliff-odt/out.odt and verify the ODF structural invariant: zip archive whose FIRST entry is mimetype with content application/vnd.oasis.opendocument.text, plus content.xml present. Empirically the committed source.odt's paragraphs are truncated (e.g. "…specializes in" — cut mid-sentence) and do not exactly match the full xlf source strings, so translate-toolkit's exact-match finds no unit and no Chinese is injected — asserting translated targets would be dishonest for this fixture. Structure + exit 0 is the assertable contract (exit-code standard). The snippet exits 0 with an OK: message when the structure holds, or exits 1 naming the problem otherwise.
