name: orf-xliff-docx
description: >-
  ORF apply-xliff backfill to DOCX: run the real `orf apply-xliff` CLI on the
  committed translated-XLIFF fixture pair (source.docx + source.xlf from
  scenarios/_fixtures/translated_pair/, pre-translated, hermetic) and verify the
  backfilled DOCX carries the OOXML structural signature (zip with
  word/document.xml, python-docx opens it) AND the translated Chinese targets
  from the XLIFF (水星机器人 — 产品概述 in word/document.xml).
category: orf-xliff
tier: 1
requires_env: []
instructions: |-
  Prove ORF apply-xliff backfills the committed translated-XLIFF pair to DOCX with the real surface. 1) the copy step stages the 8 committed fixture files (7 per-format sources + the pre-translated source.xlf with 18 Chinese targets) into /tmp/omni_val/orf-xliff-docx/; 2) the skeleton step runs the real OPP CLI to generate skeleton.zip at run time (`opp source.docx --target-format both`) into a skel/ subdir — the skeleton is layout, not input content, and is NOT committed; 3) the CLI step runs `orf apply-xliff <skeleton.zip> --xliff <translated xlf> --format docx` and must exit 0; 4) the assert step unzips the output and checks: OOXML zip with word/document.xml, python-docx opens with >= 1 paragraph, and the translated Chinese target 水星机器人 appears in document.xml (the xlf target for unit id=1 is 水星机器人 — 产品概述). No LLM, no FAKE_LLM — the fixture is pre-translated and hermetic (tier 1).
steps:
  - name: Stage committed translated fixture pair
    kind: python
    command: |-
      import pathlib, shutil
      src = pathlib.Path("scenarios/_fixtures/translated_pair")
      d = pathlib.Path("/tmp/omni_val/orf-xliff-docx")
      d.mkdir(parents=True, exist_ok=True)
      files = [f for f in src.iterdir() if f.is_file()]
      for f in files:
          shutil.copy2(f, d / f.name)
      print("COPIED %d fixture files" % len(files))
    expect:
      exit_code: 0
      stdout_has: ["COPIED 8 fixture files"]
    standard: STANDARDS.md#exit-codes
    instructions: |-
      Copy the committed fixture pair (8 files: source.docx/pptx/epub/html/odt/pdf/json + the pre-translated source.xlf) from scenarios/_fixtures/translated_pair/ into the scenario work dir /tmp/omni_val/orf-xliff-docx/ via shutil.copy2. Check: the snippet exits 0 and prints "COPIED 8 fixture files" (the count is falsifiable — a fixture drift would fail here).
  - name: Generate DOCX skeleton.zip at run time via OPP
    kind: cli
    command: opp /tmp/omni_val/orf-xliff-docx/source.docx --target-format both --source-lang en --target-lang zh --output-dir /tmp/omni_val/orf-xliff-docx/skel -v
    timeout_seconds: 300
    expect:
      exit_code: 0
      stderr_has: ["[INFO] Generated:"]
    standard: STANDARDS.md#exit-codes
    instructions: |-
      Generate the skeleton.zip at run time with the REAL OPP CLI: `opp source.docx --target-format both -s en -t zh -o skel/ -v`. The skeleton is layout (the original DOCX zip structure), not input content, so it is generated at run time and never committed. OPP writes source.skeleton.zip + an untranslated source.xlf into skel/ (that untranslated xlf is NOT used — the backfill uses the committed translated source.xlf). Check: exit code 0 and the OPP -v marker "[INFO] Generated:" on stderr (OPP stdout is empty on success).
  - name: Backfill translated XLIFF to DOCX with orf apply-xliff
    kind: cli
    command: orf apply-xliff /tmp/omni_val/orf-xliff-docx/skel/source.skeleton.zip --xliff /tmp/omni_val/orf-xliff-docx/source.xlf --output /tmp/omni_val/orf-xliff-docx/out.docx --format docx
    timeout_seconds: 300
    expect:
      exit_code: 0
      stdout_has: ["Created /tmp/omni_val/orf-xliff-docx/out.docx"]
    standard: STANDARDS.md#exit-codes
    collect_artifacts:
      - path: /tmp/omni_val/orf-xliff-docx/out.docx
    instructions: |-
      Run the REAL orf CLI backfill: `orf apply-xliff <docx skeleton.zip> --xliff <committed translated source.xlf> --output out.docx --format docx`. The DOCX skeleton.zip (generated by OPP in the previous step) is the input; the committed translated XLIFF supplies the 18 Chinese targets. Check: exit code 0 (STANDARDS.md#exit-codes) and stdout announces "Created <path>" (printed for both fresh and cached conversions). The assertion on the output content is the next step.
  - name: Assert DOCX structure and translated targets present
    kind: python
    command: |-
      import sys, zipfile
      p = "/tmp/omni_val/orf-xliff-docx/out.docx"
      try:
          assert zipfile.is_zipfile(p), "not a zip archive"
          z = zipfile.ZipFile(p)
          names = z.namelist()
          assert "word/document.xml" in names, "missing word/document.xml"
          doc = z.read("word/document.xml").decode("utf-8")
          assert "水星机器人" in doc, "translated target 水星机器人 not backfilled into word/document.xml"
          from docx import Document
          d = Document(p)
          assert len(d.paragraphs) > 0, "python-docx opens with zero paragraphs"
          print("OK: OOXML zip with word/document.xml; translated target 水星机器人 present; python-docx opens with %d paragraphs" % len(d.paragraphs))
      except Exception as e:
          print("ERROR: %s" % e)
          sys.exit(1)
    expect:
      exit_code: 0
      stdout_has: ["OK:"]
    standard: STANDARDS.md#opens-docx
    collect_artifacts:
      - path: /tmp/omni_val/orf-xliff-docx/out.docx
    instructions: |-
      Read /tmp/omni_val/orf-xliff-docx/out.docx and verify: (1) OOXML zip archive with word/document.xml; (2) python-docx opens it with >= 1 paragraph (STANDARDS.md#opens-docx — the functional floor from scripts/omo_loop.py Q1); (3) the backfilled document.xml contains the translated Chinese target 水星机器人 — the xlf target for unit id=1 is "水星机器人 — 产品概述", so a successful backfill MUST carry it. The snippet exits 0 with an OK: message when all three hold, or exits 1 naming the problem otherwise.
